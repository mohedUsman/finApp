services:

  # ── Option A (current): backend + frontend in Docker, MySQL stays LOCAL ──────
  # Your existing MySQL data is untouched.
  # host.docker.internal lets the backend container reach your local MySQL.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrack-backend
    env_file:
      - .env                    # passes all vars from .env into the container
    environment:
      # These two override the .env values so the container reaches local MySQL
      DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/fintrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CORS_ALLOWED_ORIGINS: http://localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Option B (full Docker): uncomment below + comment out Option A above ─────
